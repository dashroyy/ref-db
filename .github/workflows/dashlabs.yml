# Checks the DashLabs site (dashlabs/) whenever it changes: tests, type check, build.
# Separate from the REF·DB deploy workflow; it never deploys anything.
name: DashLabs checks

on:
  push:
    paths: ['dashlabs/**', '.github/workflows/dashlabs.yml']
  pull_request:
    paths: ['dashlabs/**', '.github/workflows/dashlabs.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashlabs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashlabs/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit -p .
      - run: npm run build
      - run: npm run validate
